<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="ext-resource-dependency" content="assets/aaa-logo-white.png" data-resource-id="logoWhite" />
<meta name="ext-resource-dependency" content="assets/amber.png" data-resource-id="amber" />
<title>AI Automation Australia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script>
window.__resources = {};
document.querySelectorAll('meta[name="ext-resource-dependency"]').forEach(function(m) {
  var id = m.getAttribute("data-resource-id");
  var src = m.getAttribute("content");
  if (id && src) window.__resources[id] = src;
});
window.addEventListener("error", function(e) {
  var pre = document.getElementById("__err") || document.createElement("pre");
  pre.id = "__err";
  pre.style.cssText = "position:fixed;top:0;left:0;right:0;background:#300;color:#fff;font:12px monospace;padding:12px;white-space:pre-wrap;z-index:99999;max-height:50vh;overflow:auto;";
  pre.textContent += (e.message || e.error || "Unknown error") + " @ " + (e.filename || "?") + ":" + (e.lineno || "?") + "\n";
  document.body.appendChild(pre);
});
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: #0a1020; }
  .card-hover { transition: transform 0.35s cubic-bezier(.2,.7,.2,1), box-shadow 0.35s ease; will-change: transform; }
  .card-hover:hover { transform: scale(1.03); z-index: 2; position: relative; box-shadow: 0 24px 60px rgba(0,0,0,0.4); }
  .testimonial-card { transition: border-color 0.35s ease, box-shadow 0.35s ease; }
  .testimonial-card:hover { transform: none !important; border-color: #ec4899 !important; box-shadow: 0 12px 40px rgba(236,72,153,0.18); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react" src="_standalone_app.js"></script>
<template id="__bundler_thumbnail" data-bg-color="#0a1020">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="thumbGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#00bfff"/>
        <stop offset="50%" stop-color="#a855f7"/>
        <stop offset="100%" stop-color="#ec4899"/>
      </linearGradient>
    </defs>
    <text x="600" y="430" font-family="Manrope, sans-serif" font-weight="800" font-size="260" fill="url(#thumbGrad)" text-anchor="middle" letter-spacing="-12">AAA</text>
    <text x="600" y="540" font-family="DM Sans, sans-serif" font-weight="600" font-size="42" fill="#ffffff" opacity="0.7" text-anchor="middle" letter-spacing="6">AI AUTOMATION AUSTRALIA</text>
  </svg>
</template>
</body>
</html>
